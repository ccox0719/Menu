<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#365c49"><title>Family Menu</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;--bg:#f5f7f3;--fg:#21362b;--card:#fff;--line:#d9e3dc;--green:#365c49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;min-height:44px;cursor:pointer}button.primary,.active{background:var(--green);color:#fff}input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card);width:100%;min-height:44px}header{padding:18px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}.wrap{max-width:820px;margin:auto;padding:15px 15px 100px}.between,.flex,.day,.item{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.flex{flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0}.day{flex-wrap:wrap}.day strong{width:75px}.day select{flex:1;min-width:150px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:7px;background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:4}.tabs button{flex:1;max-width:230px}small,.muted{color:#788b7e}h1{font-size:22px;margin:0}h2{font-size:20px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item .name{flex:1}.item button{padding:8px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:12px;z-index:9}.dialog{background:var(--card);padding:18px;border-radius:18px;width:min(100%,550px);max-height:90dvh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.store .item{min-height:75px;font-size:18px}.store .edit{display:none}@media(prefers-color-scheme:dark){:root{--bg:#121c16;--fg:#e7f1e9;--card:#1b2a20;--line:#3b5042;--green:#537c62}small,.muted{color:#a6b7a9}}
</style></head><body><header><div class="between"><h1>🍲 Family Menu</h1><small id="status">Connecting…</small></div></header><main class="wrap" id="app"></main><nav class="tabs" id="tabs"></nav><div id="modal"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const VERSION='fresh-2026-10-09',db=window.supabase.createClient('https://svaozzitkajgqzacldur.supabase.co',"sb_publishable_scbeO9M_PR8Zvkh-1nbheA_lZLwl31b",{db:{schema:'meals'}}),CODE='public-meals',cats=['Produce','Meat','Seafood','Dairy','Bakery','Frozen','Pantry'];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c])),norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' '),plus=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},sat=()=>{let d=new Date();d.setDate(d.getDate()-(d.getDay()+1)%7);return d.toISOString().slice(0,10)},fmt=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
let S={week:sat(),shop:sat(),tab:'plan',store:false,large:false,swap:null,search:'',meals:[],items:[],links:[],data:{},ready:false,edit:null};
const plan=()=>S.data.plans?.[S.week]||{},buy=id=>S.links.filter(l=>l.meal_id===id).map(l=>S.items.find(i=>i.id===l.ingredient_id)).filter(Boolean);
function grocery(){const p=S.data.plans?.[S.shop]||{},map=new Map();for(let n=0;n<7;n++){let d=p[n],m=S.meals.find(x=>x.id===d?.meal&&!d?.notMade);if(!m)continue;for(let i of buy(m.id)){let k=norm(i.name);if(!map.has(k))map.set(k,{key:k,name:i.name,category:i.grocery_category||'Pantry',sources:[],manual:false,quantity:1});let x=map.get(k);if(!x.sources.includes(m.name))x.sources.push(m.name)}}for(let i of S.data.manual?.[S.shop]||[]){let k=norm(i.name);if(map.has(k))map.get(k).manual=true;else map.set(k,{key:k,name:i.name,category:i.category||'Pantry',sources:[],manual:true,quantity:i.quantity||1})}return [...map.values()].map(x=>({...x,quantity:S.data.quantities?.[S.shop]?.[x.key]||x.quantity,checked:!!S.data.checked?.[S.shop]?.[x.key]})).sort((a,b)=>a.name.localeCompare(b.name))}
async function load(){try{let r=await Promise.all([db.from('households').select('data').eq('code',CODE).single(),db.from('meals').select('*').eq('household_code',CODE).eq('is_active',true).order('name'),db.from('ingredients').select('*').eq('is_active',true),db.from('meal_ingredients').select('*')]);for(let q of r)if(q.error)throw q.error;S.data=r[0].data.data||{};S.meals=r[1].data;S.items=r[2].data;S.links=r[3].data;S.ready=true;$('status').textContent='Synced';render()}catch(e){$('status').textContent='Sync error';$('app').innerHTML='<div class="card">'+esc(e.message)+'</div>';console.error(e)}}
async function save(){let q=await db.from('households').update({data:S.data,updated:new Date().toISOString()}).eq('code',CODE);if(q.error){alert('Save failed: '+q.error.message);throw q.error}$('status').textContent='Synced'}
async function day(n,id){S.data.plans ||= {};S.data.plans[S.week] ||= {};S.data.plans[S.week][n]={meal:id||null,notMade:false};await save();render()}
const opts=id=>'<option value="">Choose a meal</option>'+S.meals.map(m=>'<option value="'+esc(m.id)+'" '+(id===m.id?'selected':'')+'>'+esc(m.name)+'</option>').join('');
function render(){if(!S.ready)return;$('tabs').innerHTML=[['plan','Week'],['grocery','Groceries'],['library','Meals']].map(([k,v])=>'<button data-tab="'+k+'" class="'+(S.tab===k?'active':'')+'">'+v+'</button>').join('');$('app').className='wrap '+(S.store?'store':'');$('app').innerHTML=S.tab==='plan'?renderPlan():S.tab==='grocery'?renderGrocery():renderMeals()}
function suggested(){const p=plan(),used=new Set(Object.values(p).map(x=>x?.meal).filter(Boolean)),carry=[];for(let w=1;w<=8;w++){const prev=S.data.plans?.[plus(S.week,-7*w)]||{};for(let x of Object.values(prev)){if(x?.notMade&&x.meal&&!used.has(x.meal)&&!carry.includes(x.meal))carry.push(x.meal)}}return [...carry.map(id=>S.meals.find(m=>m.id===id)).filter(Boolean),...S.meals.filter(m=>!used.has(m.id)&&!carry.includes(m.id)).sort((a,b)=>(Number(b.prior)-Number(a.prior))||((b.rating||0)-(a.rating||0)))]}
function renderPlan(){let p=plan();return '<div class="between"><button data-act="prev">‹</button><strong>'+fmt(S.week)+' – '+fmt(plus(S.week,6))+'</strong><button data-act="next">›</button></div><div class="flex" style="margin:15px 0"><button data-act="today">This week</button><button class="primary" data-act="fill">✨ Fill my week</button><button data-act="random">Shuffle all</button><button data-act="swap">'+(S.swap===null?'Swap':'Cancel swap')+'</button><button data-act="clear">Clear</button></div><label><input id="large" type="checkbox" style="width:auto;min-height:auto" '+(S.large?'checked':'')+'> Sunday randomization: Large Group only</label>'+['Sat','Sun','Mon','Tue','Wed','Thu','Fri'].map((name,n)=>{let d=p[n]||{};return '<div class="card day"><strong>'+name+'<br><small>'+fmt(plus(S.week,n))+'</small></strong><select data-day="'+n+'">'+opts(d.meal)+'</select><button data-roll="'+n+'">↻</button><button data-not="'+n+'" '+(!d.meal?'disabled':'')+'>'+(d.notMade?'Not made':'✓')+'</button>'+(S.swap!==null?'<button data-swap="'+n+'">Swap here</button>':'')+'</div>'}).join('')+'<div class="card"><strong>Suggested next</strong><p class="muted">Meals you missed recently and family favorites.</p>'+suggested().slice(0,5).map(m=>'<button data-suggest="'+m.id+'" style="margin:3px">'+esc(m.name)+'</button>').join('')+'</div><small>Build '+VERSION+'</small>'}
function renderGrocery(){let rows=grocery(),section=arr=>cats.map(c=>{let a=arr.filter(x=>x.category===c);return a.length?'<h3>'+c+'</h3><div class="card">'+a.map(x=>'<div class="item" data-check="'+esc(x.key)+'"><span>'+(x.checked?'☑':'□')+'</span><div class="name"><strong>'+esc(x.name)+'</strong><br><small>'+esc(x.sources.join(' · ')||'Manual')+'</small></div><span>'+x.quantity+'</span><div class="edit"><button data-qty="-1" data-name="'+esc(x.key)+'">−</button><button data-qty="1" data-name="'+esc(x.key)+'">+</button>'+(x.manual?'<button data-del="'+esc(x.key)+'">×</button>':'')+'</div></div>').join('')+'</div>':''}).join('');return '<div class="between"><h2>Groceries</h2><button data-act="store">'+(S.store?'Exit store mode':'Store mode')+'</button></div><div class="between"><button data-act="shopPrev">‹</button><strong>'+fmt(S.shop)+' – '+fmt(plus(S.shop,6))+'</strong><button data-act="shopNext">›</button></div>'+(S.store?'':'<div class="flex" style="margin:12px 0"><input id="manual" placeholder="Add an item" style="flex:1"><button data-act="addManual">Add</button><button data-act="clearManual">Clear manual</button></div>')+section(rows.filter(x=>!x.checked))+(rows.some(x=>x.checked)?'<h2>In Cart</h2>'+section(rows.filter(x=>x.checked)):'')+(!rows.length?'<p class="muted">Select meals or add groceries.</p>':'')}
function renderMeals(){return '<div class="between"><h2>Meals</h2><button class="primary" data-act="new">+ New</button></div><input id="search" placeholder="Search meals" value="'+esc(S.search)+'">'+S.meals.filter(m=>norm(m.name).includes(norm(S.search))).sort((a,b)=>a.name.localeCompare(b.name)).map(m=>'<div class="card"><div class="between"><div><strong>'+esc(m.name)+'</strong><br><small>'+esc(m.category||'Other')+' · '+esc(m.group_size||'Family')+' · '+(m.rating||'–')+' ★ '+(m.prior?'♥':'')+'</small></div><button data-edit="'+m.id+'">Edit</button></div><small>Buy: '+esc(buy(m.id).map(x=>x.name).join(' · ')||'None')+'</small></div>').join('')}
function edit(id){S.edit=id;let m=S.meals.find(x=>x.id===id)||{};$('modal').innerHTML='<div class="modal"><div class="dialog"><div class="between"><h2>'+(id?'Edit':'New')+' meal</h2><button data-act="close">×</button></div><div class="field"><label>Name</label><input id="mealName" value="'+esc(m.name||'')+'"></div><div class="field"><label>Rating</label><select id="mealRating">'+[1,2,3,4,5].map(n=>'<option '+(n===(m.rating||3)?'selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="field"><label>Category</label><input id="mealCategory" value="'+esc(m.category||'Dinner')+'"></div><div class="field"><label>Group</label><select id="mealGroup">'+['Family','Company','Large Group'].map(g=>'<option '+(g===m.group_size?'selected':'')+'>'+g+'</option>').join('')+'</select></div><label><input type="checkbox" id="favorite" style="width:auto;min-height:auto" '+(m.prior?'checked':'')+'> Favorite</label><div class="field"><label>Buy for this meal (one item per line)</label><textarea id="mealBuy" rows="8">'+esc(id?buy(id).map(x=>x.name).join('\n'):'')+'</textarea><small>Enter only items you normally purchase.</small></div><button class="primary" data-act="saveMeal">Save meal</button> '+(id?'<button data-act="removeMeal">Delete</button>':'')+'</div></div>'}
async function saveMeal(){let name=$('mealName').value.trim();if(!name)return alert('Enter a name');let payload={household_code:CODE,name,normalized_name:norm(name),rating:+$('mealRating').value,category:$('mealCategory').value,group_size:$('mealGroup').value,prior:$('favorite').checked};let r=S.edit?await db.from('meals').update(payload).eq('id',S.edit).select().single():await db.from('meals').insert(payload).select().single();if(r.error)return alert(r.error.message);let id=r.data.id,names=[...new Set($('mealBuy').value.split('\n').map(norm).filter(Boolean))];for(let k of names){let item=S.items.find(x=>norm(x.name)===k);if(!item){let q=await db.from('ingredients').upsert({name:k,normalized_name:k,grocery_category:'Pantry'},{onConflict:'normalized_name'}).select().single();if(q.error)return alert(q.error.message);item=q.data;S.items.push(item)}if(!S.links.some(l=>l.meal_id===id&&l.ingredient_id===item.id)){let q=await db.from('meal_ingredients').insert({meal_id:id,ingredient_id:item.id,source:'manual',needs_review:false});if(q.error)return alert(q.error.message)}}for(let l of S.links.filter(x=>x.meal_id===id&&!names.includes(norm(S.items.find(i=>i.id===x.ingredient_id)?.name)))){let q=await db.from('meal_ingredients').delete().eq('id',l.id);if(q.error)return alert(q.error.message)}$('modal').innerHTML='';await load()}
document.addEventListener('change',async e=>{if(e.target.id==='large')S.large=e.target.checked;if(e.target.matches('[data-day]'))await day(+e.target.dataset.day,e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;let pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}});
document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-check]');if(!b)return,d=b.dataset;if(d.tab){S.tab=d.tab;S.store=false;render();return}if(d.edit){edit(d.edit);return}if(d.suggest){const n=Array.from({length:7},(_,i)=>i).find(i=>!plan()[i]?.meal);if(n===undefined)return alert('Clear a day to add a suggested meal');await day(n,d.suggest);return}if(d.roll!==undefined){let n=+d.roll,pool=S.meals.filter(m=>m.id!==plan()[n]?.meal&&(n!==1||!S.large||m.group_size==='Large Group'));if(pool.length)await day(n,pool[Math.floor(Math.random()*pool.length)].id);return}if(d.not!==undefined){let p=plan()[+d.not];if(p){p.notMade=!p.notMade;await save();render()}return}if(d.swap!==undefined){let p=S.data.plans[S.week],n=+d.swap;[p[n],p[S.swap]]=[p[S.swap],p[n]];S.swap=null;await save();render();return}if(d.check){if(e.target.closest('button'))return;S.data.checked ||= {};S.data.checked[S.shop] ||= {};S.data.checked[S.shop][d.check]=!S.data.checked[S.shop][d.check];await save();render();return}if(d.qty){S.data.quantities ||= {};S.data.quantities[S.shop] ||= {};let row=grocery().find(x=>x.key===d.name);S.data.quantities[S.shop][d.name]=Math.max(1,(row?.quantity||1)+ +d.qty);await save();render();return}if(d.del){S.data.manual[S.shop]=(S.data.manual?.[S.shop]||[]).filter(x=>norm(x.name)!==d.del);await save();render();return}switch(d.act){case'prev':S.week=plus(S.week,-7);break;case'next':S.week=plus(S.week,7);break;case'today':S.week=sat();break;case'shopPrev':S.shop=plus(S.shop,-7);break;case'shopNext':S.shop=plus(S.shop,7);break;case'store':S.store=!S.store;break;case'swap':S.swap=S.swap===null?0:null;break;case'fill':{S.data.plans ||= {};S.data.plans[S.week] ||= {};const used=new Set(Object.values(plan()).map(x=>x?.meal).filter(Boolean));let pool=suggested();for(let n=0;n<7;n++){if(plan()[n]?.meal)continue;let eligible=pool.filter(m=>!used.has(m.id)&&(n!==1||!S.large||m.group_size==='Large Group'));let m=eligible[0];if(m){S.data.plans[S.week][n]={meal:m.id,notMade:false};used.add(m.id)}}await save();break}case'random':S.data.plans ||= {};S.data.plans[S.week] ||= {};for(let n=0;n<7;n++){let pool=S.meals.filter(m=>n!==1||!S.large||m.group_size==='Large Group');if(pool.length)S.data.plans[S.week][n]={meal:pool[Math.floor(Math.random()*pool.length)].id,notMade:false}}await save();break;case'clear':if(confirm('Clear week?')){S.data.plans[S.week]={};await save()}break;case'addManual':{let name=$('manual').value.trim();if(!name)break;S.data.manual ||= {};S.data.manual[S.shop] ||= [];if(!S.data.manual[S.shop].some(x=>norm(x.name)===norm(name)))S.data.manual[S.shop].push({name,category:'Pantry',quantity:1});await save();break}case'clearManual':if(confirm('Clear manual groceries?')){S.data.manual ||= {};S.data.manual[S.shop]=[];await save()}break;case'new':edit(null);return;case'close':$('modal').innerHTML='';return;case'saveMeal':await saveMeal();return;case'removeMeal':if(confirm('Delete meal?')){let q=await db.from('meals').update({is_active:false}).eq('id',S.edit);if(q.error)alert(q.error.message);else{$('modal').innerHTML='';await load()}}return}render()});
load();
</script></body></html>
