async function carryMissedTo(targetWeek){

 if(!previous)return false;

 const done=S.data.carryoverDone[targetWeek] ||= {};

 for(let n=0;n<7;n++){
  const old=previous[n],meal=old?.meal;
  if(!old?.notMade||!meal||done[n])continue;

ass="date"><strong>'+d+'</strong><small>'+date(shift(S.week,n))+'</small></span><span class="meal-name"><strong>'+esc(m?.name||'Choose a meal')+'</strong>'+(day?.notMade?'<small>Not made · suggest again</small>':day?.hosting?'<small>Hosting · group meals</small>':'')+'</span></button><button class="round reroll" data-roll="'+n+'" aria-label="Reroll '+d+' meal" title="Reroll meal">'+icon('reroll')+'</button><button class="row-more" data-more-day="'+n+'" aria-label="More options for '+d+'" title="Meal options">'+icon('more')+'</button></div>'}).join('')+'</div><div class="panel"><div class="between"><strong>On deck</strong><span class="tag">Your favorites + missed meals</span></div><div class="toolbar">'+suggestions().slice(0,4).map(m=>'<button data-add="'+m.id+'">'+esc(m.name)+'</button>').join('')+'</div></div><small>Version '+BUILD+'</small>'}
function dayMenu(n){let day=current()[n]||{},m=S.meals.find(x=>x.id===day.meal);$('#overlay').innerHTML='<div class="overlay"><div class="sheet day-actions"><div class="between"><div><small class="eyebrow">'+D[n]+' '+date(shift(S.week,n))+'</small><h2>'+esc(m?.name||'No meal chosen')+'</h2></div><button data-action="close" aria-label="Close">✕</button></div><button data-pick="'+n+'">Choose a different meal <span>›</span></button><button data-swap-start="'+n+'">Swap with another day <span>↔</span></button><button data-hosting="'+n+'">'+(day.hosting?'Stop hosting':'Hosting a group')+' <span>›</span></button>'+(m?'<button data-missed="'+n+'">'+(day.notMade?'Undo not made':'Didn’t make this meal')+' <span>›</span></button>':'')+'<button data-clear-day="'+n+'">Clear this day <span>›</span></button></div></div>'}
function renderStore(){let rows=shopping(),left=rows.filter(x=>!x.checked).length;return '<div class="store-header"><div><strong>Shopping</strong><small>'+left+' left · '+date(S.shop)+' – '+date(shift(S.shop,6))+'</small></div><button class="primary" data-action="store" aria-label="Exit store mode">Done ✕</button></div><div class="store-list">'+(!rows.length?'<p class="muted">Your shopping list is empty.</p>':!left?'<p class="store-complete">✓ Everything is in your cart!</p>':'')+C.map(cat=>{let items=rows.filter(x=>x.category===cat);return items.length?'<h3>'+cat+'</h3>'+items.map(x=>'<button class="store-item '+(x.checked?'collected':'')+'" data-check="'+esc(x.key)+'" aria-pressed="'+x.checked+'" aria-label="'+esc((x.checked?'Uncheck ':'Check off ')+x.name)+'"><span class="store-check" aria-hidden="true">'+(x.checked?'✓':'')+'</span><span class="store-name"><strong>'+esc(x.name)+'</strong><small>'+esc(x.sources.join(' · ')||'Added by you')+'</small></span><span class="store-qty">×'+x.qty+'</span></button>').join(''):''}).join('')+'</div>'}
function renderShop(){if(S.store)return renderStore();let rows=shopping(),section=(arr)=>C.map(cat=>{let items=arr.filter(x=>x.category===cat);return items.length?'<h3>'+cat+'</h3><div class="panel">'+items.map(x=>'<div class="shop-row '+(x.checked?'done':'')+'" data-check="'+esc(x.key)+'"><button class="check ghost" data-check="'+esc(x.key)+'">'+(x.checked?'☑':'□')+'</button><div class="grow"><strong>'+esc(x.name)+'</strong><small>'+esc(x.sources.join(' · ')||'Added by you')+'</small></div><div class="adjust flex"><button data-qty="-1" data-name="'+esc(x.key)+'">−</button></div><span class="qty">'+x.qty+'</span><div class="adjust"><button data-qty="1" data-name="'+esc(x.key)+'">+</button>'+(x.manual?'<button data-remove="'+esc(x.key)+'">×</button>':'')+'</div></div>').join('')+'</div>':''}).join('');return '<div class="between"><div><div class="eyebrow">Everything in one place</div><h1>Shopping list</h1></div><button data-action="store" class="'+(S.store?'primary':'')+'">'+(S.store?'Done shopping':'Store mode')+'</button></div><div class="weeknav"><button data-action="shopPrev">‹</button><strong>'+date(S.shop)+' – '+date(shift(S.shop,6))+'</strong><button data-action="shopNext">›</button></div>'+(!S.store?renderUsuals():'')+'<div class="between"><h2>To pick up</h2><span class="flex"><span class="tag">'+rows.filter(x=>!x.checked).length+' items</span>'+(rows.length?'<button class="clear-cart" data-action="clearAll" aria-label="Clear the whole shopping list">Clear all</button>':'')+'</span></div>'+section(rows.filter(x=>!x.checked))+(rows.some(x=>x.checked)?'<div class="between"><h2>In your cart</h2>'+'</div>'+section(rows.filter(x=>x.checked)):'')+(!rows.length?'<div class="panel muted">Your list fills itself as you plan meals. You can also add anything manually.</div>':'')}
function renderMeals(){let list=S.meals.filter(m=>norm(m.name).includes(norm(S.search))).sort((a,b)=>a.name.localeCompare(b.name));return '<div class="between"><div><div class="eyebrow">Your family’s collection</div><h1>Meal book</h1><small>'+S.meals.length+' saved meals</small></div><button class="primary" data-action="new">+ Add meal</button></div><div class="toolbar"><input id="search" placeholder="Find a family favorite…" value="'+esc(S.search)+'"></div><div class="grid">'+list.map(m=>'<div class="meal-card"><div class="between"><strong>'+esc(m.name)+'</strong><button data-edit="'+m.id+'">Edit</button></div><p>'+esc(m.group_size||'Family')+' · '+(m.rating||'–')+' ★ '+(m.prior?' · ♥ Favorite':'')+'</p><small>Buy: '+esc(purchases(m.id).map(x=>x.name).join(', ')||'Nothing needed')+'</small></div>').join('')+'</div>'}
function pick(n){let p=current()[n],options=eligibleMeals(n).slice().sort((a,b)=>a.name.localeCompare(b.name));$('#overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="between"><h2>Choose '+D[n]+(p?.hosting?' group dinner':' dinner')+'</h2><button data-action="close">✕</button></div><input id="pickSearch" placeholder="Search your meals…"><div id="pickList" style="margin-top:12px">'+options.map(m=>'<button style="width:100%;text-align:left;margin:3px 0" data-select="'+m.id+'" data-day="'+n+'">'+esc(m.name)+'</button>').join('')+'</div><button data-select="" data-day="'+n+'">Clear this day</button></div></div>'}
function edit(id){S.edit=id;let m=S.meals.find(x=>x.id===id)||{};$('#overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="between"><h2>'+ (id?'Edit meal':'Add a meal')+'</h2><button data-action="close">✕</button></div><div class="field"><label>Meal name</label><input id="mealName" value="'+esc(m.name||'')+'"></div><div class="field"><label>Rating</label><select id="rating">'+[1,2,3,4,5].map(x=>'<option '+(x===(m.rating||3)?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Category</label><input id="category" value="'+esc(m.category||'Dinner')+'"></div><div class="field"><label>Serves</label><select id="group">'+['Family','Company','Large Group'].map(x=>'<option '+(x===m.group_size?'selected':'')+'>'+x+'</option>').join('')+'</select></div><label><input id="favorite" type="checkbox" style="width:auto;min-height:auto" '+(m.prior?'checked':'')+'> Family favorite</label><div class="field"><label>What to buy (one item per line)</label><textarea id="buy" rows="7">'+esc(id?purchases(id).map(x=>x.name).join('\n'):'')+'</textarea><small>Leave pantry staples out unless you need to buy them.</small></div><div class="toolbar"><button class="primary" data-action="saveMeal">Save meal</button>'+(id?'<button data-action="deleteMeal">Remove</button>':'')+'</div></div></div>'}
async function saveMeal(){let name=$('#mealName').value.trim();if(!name)return alert('Add a meal name');let payload={household_code:CODE,name,normalized_name:norm(name),rating:+$('#rating').value,category:$('#category').value,group_size:$('#group').value,prior:$('#favorite').checked};let r=S.edit?await db.from('meal_app_meals').update(payload).eq('id',S.edit).select().single():await db.from('meal_app_meals').insert(payload).select().single();if(r.error)return alert(r.error.message);let id=r.data.id,names=[...new Set($('#buy').value.split('\n').map(norm).filter(Boolean))];for(let k of names){let item=S.ingredients.find(x=>norm(x.name)===k);if(!item){let q=await db.from('meal_app_ingredients').upsert({name:k,normalized_name:k,grocery_category:'Pantry'},{onConflict:'normalized_name'}).select().single();if(q.error)return alert(q.error.message);item=q.data;S.ingredients.push(item)}if(!S.links.some(l=>l.meal_id===id&&l.ingredient_id===item.id)){let q=await db.from('meal_app_meal_ingredients').insert({meal_id:id,ingredient_id:item.id,source:'manual',needs_review:false});if(q.error)return alert(q.error.message)}}for(let l of S.links.filter(x=>x.meal_id===id&&!names.includes(norm(S.ingredients.find(i=>i.id===x.ingredient_id)?.name)))){let q=await db.from('meal_app_meal_ingredients').delete().eq('id',l.id);if(q.error)return alert(q.error.message)}$('#overlay').innerHTML='';await load()}
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}if(e.target.id==='pickSearch'){let q=norm(e.target.value);for(let b of document.querySelectorAll('[data-select]'))b.hidden=!norm(b.textContent).includes(q)}});
document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-check]');if(!b)return;if(b.type==='submit'&&b.form)return;let d=b.dataset;if(d.usual){let x=usuals().find(x=>norm(x.name)===norm(d.usual));await addManual(d.usual,x?.category||categoryFor(d.usual));return}if(d.hideUsual){S.data.hiddenUsuals ||= [];if(!S.data.hiddenUsuals.includes(norm(d.hideUsual)))S.data.hiddenUsuals.push(norm(d.hideUsual));await save();render();manageUsuals();return}if(d.tab){openTab(d.tab);return}if(d.moreDay!==undefined){dayMenu(+d.moreDay);return}if(d.swapStart!==undefined){chooseSwap(+d.swapStart);return}if(d.swapFrom!==undefined&&d.swapTo!==undefined){await swapDays(+d.swapFrom,+d.swapTo);return}if(d.clearDay!==undefined){$('#overlay').innerHTML='';await setMeal(+d.clearDay,null);return}if(d.hosting!==undefined){$('#overlay').innerHTML='';await toggleHosting(+d.hosting);return}if(d.pick!==undefined){pick(+d.pick);return}if(d.edit){edit(d.edit);return}if(d.select!==undefined){$('#overlay').innerHTML='';await setMeal(+d.day,d.select);return}if(d.roll!==undefined){let n=+d.roll,options=eligibleMeals(n,suggestions()).filter(m=>m.id!==current()[n]?.meal);if(options.length)await setMeal(n,options[Math.floor(Math.random()*Math.min(options.length,8))].id);return}if(d.missed!==undefined){$('#overlay').innerHTML='';let p=current()[+d.missed];p.notMade=!p.notMade;await save();render();return}if(d.add){let n=D.findIndex((_,i)=>!current()[i]?.meal&&eligibleMeals(i).some(m=>m.id===d.add));if(n===-1)return alert('Choose a day to replace first');await setMeal(n,d.add);return}if(d.check!==undefined){if(e.target.closest('[data-qty],[data-remove]'))return;S.data.checked ||= {};S.data.checked[S.shop] ||= {};S.data.checked[S.shop][d.check]=!S.data.checked[S.shop][d.check];await save();render();return}if(d.qty){S.data.quantities ||= {};S.data.quantities[S.shop] ||= {};let x=shopping().find(x=>x.key===d.name);S.data.quantities[S.shop][d.name]=Math.max(1,(x?.qty||1)+Number(d.qty));await save();render();return}if(d.remove){S.data.manual[S.shop]=(S.data.manual?.[S.shop]||[]).filter(x=>norm(x.name)!==d.remove);await save();render();return}switch(d.action){case'manageUsuals':manageUsuals();return;case'restoreUsuals':S.data.hiddenUsuals=[];await save();render();manageUsuals();return;case'groceries':openTab('shop');return;case'prev':await navigateWeek(shift(S.week,-7));return;case'next':await navigateWeek(shift(S.week,7));return;case'today':await navigateWeek(week());return;case'shopPrev':S.shop=shift(S.shop,-7);break;case'shopNext':S.shop=shift(S.shop,7);break;case'store':S.store=!S.store;break;case'fill':{S.data.plans ||= {};S.data.plans[S.week] ||= {};let used=new Set(Object.values(current()).map(x=>x?.meal)),pool=suggestions();for(let n=0;n<7;n++){if(current()[n]?.meal)continue;let m=eligibleMeals(n,pool).find(x=>!used.has(x.id));if(m){current()[n]={...current()[n],meal:m.id,notMade:false};used.add(m.id)}}await save();break}case'shuffle':{S.data.plans ||= {};S.data.plans[S.week] ||= {};let pool=S.meals.slice().sort(()=>Math.random()-.5);let used=new Set();for(let n=0;n<7;n++){let options=eligibleMeals(n,pool),m=options.find(x=>!used.has(x.id))||options[0];current()[n]={...current()[n],meal:m?.id||null,notMade:false};if(m)used.add(m.id)};await save();break}case'clear':if(confirm('Clear all seven days?')){S.data.plans ||= {};S.data.plans[S.week]=Object.fromEntries(D.map((_,n)=>[n,{hosting:!!current()[n]?.hosting,meal:null,notMade:false}]));await save()}break;case'quick':{let name=$('#quick').value.trim();await addManual(name,categoryFor(name));return}case'new':edit(null);return;case'close':$('#overlay').innerHTML='';return;case'saveMeal':await saveMeal();return;case'deleteMeal':if(confirm('Remove this meal?')){let q=await db.from('meal_app_meals').update({is_active:false}).eq('id',S.edit);if(q.error)alert(q.error.message);else{$('#overlay').innerHTML='';await load()}}return}render()});
document.addEventListener('submit',async e=>{if(e.target.id==='manualForm'){e.preventDefault();let name=$('#quick').value.trim();await addManual(name,categoryFor(name))}else if(e.target.id==='usualForm'){e.preventDefault();let name=$('#usualName').value.trim();if(!name)return;rememberUsual(name,groceryCategory(categoryFor(name)));await save();render();manageUsuals()}});
document.addEventListener('click',async e=>{if(!e.target.closest('[data-action="clearAll"]'))return;let rows=shopping();if(!rows.length)return;if(!confirm('Clear all '+rows.length+(rows.length===1?' item':' items')+' from this shopping list?'))return;S.data.cleared ||= {};S.data.cleared[S.shop]=[...new Set([...(S.data.cleared[S.shop]||[]),...rows.filter(x=>x.sources.length).map(x=>x.key)])];S.data.manual ||= {};S.data.manual[S.shop]=[];S.data.checked ||= {};S.data.checked[S.shop]={};try{await save()}catch(err){}render()});
load();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){refreshShared();if(S.ready&&S.week===shift(week(),-7))navigateWeek(week())}});
window.addEventListener('focus',()=>{refreshShared();if(S.ready&&S.week!==week()&&S.week===shift(week(),-7))navigateWeek(week())});
window.addEventListener('online',refreshShared);
setInterval(()=>{if(saving)pendingSync=true;else refreshShared()},8000);
db.channel('gather-household-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'meal_app_households',filter:'code=eq.'+CODE},()=>{if(saving)pendingSync=true;else refreshShared()}).subscribe();
</script></body></html>
