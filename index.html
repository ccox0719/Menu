:inline-block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.weeknav{display:flex;align-items:center;gap:9px;justify-content:space-between}.weeknav strong{font-size:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0}.shop-row{border-bottom:1px solid var(--line);padding:13px 2px;min-height:64px}.shop-row:last-child{border:0}.shop-row .grow{flex:1;min-width:0}.shop-row .grow strong{display:block}.shop-row .grow small{font-size:11px}.check{font-size:22px;min-width:40px}.qty{font-weight:700;font-size:13px;min-width:18px;text-align:center}.shop-row.done{opacity:.55}.store .shop-row{min-height:82px;font-size:18px}.store .adjust{display:none}.meal-card{padding:15px;border:1px solid var(--line);background:var(--paper);border-radius:16px}.meal-card strong{font-size:16px}.meal-card p{font-size:12px;color:var(--muted);margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:7px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}.tabs button{flex:1;max-width:240px;border:0;background:transparent;font-weight:650}.tabs button.active{background:var(--soft);color:var(--brand)}.overlay{position:fixed;inset:0;background:#15231a99;z-index:8;display:grid;align-items:end;justify-items:center}.sheet{background:var(--paper);width:min(100%,600px);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:24px}.field{margin:12px 0}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:6px}.tiny{font-size:12px}.error{color:#a12e2e}@media(min-width:650px){.overlay{align-items:center}.sheet{border-radius:24px}}@media(prefers-color-scheme:dark){:root{--bg:#121b15;--paper:#1e2a22;--ink:#eaf0e8;--muted:#a3b0a3;--line:#36463a;--brand:#507d5d;--soft:#304b38}}

body.shopping-mode{overflow:hidden}body.shopping-mode>header,body.shopping-mode>.tabs{display:none}main.store{position:fixed;inset:0;max-width:none;margin:0;padding:0;overflow-y:auto;background:var(--bg);z-index:6;overscroll-behavior:contain}.store-header{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--paper);border-bottom:1px solid var(--line)}.store-header strong{font-size:22px}.store-header small{display:block;margin-top:4px}.store-header button{min-height:48px;min-width:100px}.store-list{padding:4px 12px calc(24px + env(safe-area-inset-bottom))}.store-list h3{font-size:14px;margin:20px 4px 10px}.store-item{width:100%;display:flex;align-items:center;gap:16px;text-align:left;min-height:88px;padding:18px;margin-bottom:10px;border-radius:18px;touch-action:manipulation}.store-check{width:36px;height:36px;flex:none;border:2px solid var(--brand);border-radius:11px;display:grid;place-items:center;font-size:26px;font-weight:800}.store-name{flex:1;min-width:0}.store-name strong{display:block;font-size:21px;overflow-wrap:anywhere}.store-name small{display:block;margin-top:5px;font-size:12px}.store-qty{font-size:18px;font-weight:750}.store-item.collected{background:var(--soft)}.store-item.collected .store-check{background:var(--brand);color:white}.store-item.collected .store-name strong{text-decoration:line-through;color:var(--muted)}.store-complete{background:var(--soft);padding:16px;border-radius:14px;font-weight:700}
</style></head><body><header><div class="between"><div class="logo">gather<span>.</span></div><div class="header-detail"><span class="subtitle" id="sync">Connecting…</span><span class="gather-accent" aria-hidden="true"><svg viewBox="0 0 36 36" width="28" height="28" fill="none"><circle cx="18" cy="18" r="12" stroke="currentColor" stroke-width="1.2" opacity=".45"/><path d="M13 24c0-8 4-14 11-15-1 7-5 11-11 11M13 24l8-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div></div></header><main id="app"></main><nav class="tabs" id="tabs"></nav><div id="overlay"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const BUILD='gather-1.0.6',CODE='public-meals',db=supabase.createClient('https://svaozzitkajgqzacldur.supabase.co',"sb_publishable_scbeO9M_PR8Zvkh-1nbheA_lZLwl31b",{db:{schema:'public'}}),D=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'],C=['Produce','Meat','Seafood','Dairy','Bakery','Frozen','Pantry','Household','Other'];
const $=s=>document.querySelector(s),norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' '),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),shift=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},week=()=>{let d=new Date();d.setDate(d.getDate()-(d.getDay()+1)%7);return d.toISOString().slice(0,10)},date=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
let S={tab:'plan',week:week(),shop:week(),meals:[],ingredients:[],links:[],data:{},ready:false,search:'',edit:null,store:false};
const current=()=>S.data.plans?.[S.week]||{},purchases=id=>S.links.filter(l=>l.meal_id===id).map(l=>S.ingredients.find(i=>i.id===l.ingredient_id)).filter(Boolean);
const STAPLES=new Set(['salt','pepper','black pepper','oil','cooking oil','olive oil','flour','sugar','basic spices','spices','baking powder','baking soda','cornstarch','water','garlic powder','onion powder','cumin','paprika','cinnamon','chili powder']);
function groceryCategory(value){let key=norm(value),aliases={'dairy & eggs':'Dairy','meat & seafood':'Meat','household items':'Household'};return aliases[key]||C.find(c=>norm(c)===key)||'Other'}
function openTab(tab){if(tab==='shop')S.shop=S.week;else if(tab==='plan'&&S.tab==='shop')S.week=S.shop;S.tab=tab;S.store=false;render()}
const DEFAULT_USUALS=[['Milk','Dairy'],['Eggs','Dairy'],['Cucumbers','Produce'],['Carrots','Produce'],['Fruit','Produce'],['Bread','Bakery'],['Yogurt','Dairy'],['Cereal','Pantry'],['Paper towels','Household']].map(([name,category])=>({name,category}));
function usuals(){let map=new Map(),hidden=new Set((S.data.hiddenUsuals||[]).map(norm));for(let x of [...DEFAULT_USUALS,...Object.values(S.data.manual||{}).flat(),...(S.data.usuals||[])]){let k=norm(x.name);if(k&&!hidden.has(k))map.set(k,{name:x.name,category:groceryCategory(x.category)})}return [...map.values()]}
function rememberUsual(name,category){let key=norm(name);S.data.usuals ||= [];if(!S.data.usuals.some(x=>norm(x.name)===key))S.data.usuals.push({name,category});S.data.hiddenUsuals=(S.data.hiddenUsuals||[]).filter(x=>norm(x)!==key)}
async function addManual(name,category){name=name.trim();if(!name)return;category=groceryCategory(category);S.data.manual ||= {};S.data.manual[S.shop] ||= [];if(!S.data.manual[S.shop].some(x=>norm(x.name)===norm(name)))S.data.manual[S.shop].push({name,category});rememberUsual(name,category);S.data.checked ||= {};S.data.checked[S.shop] ||= {};S.data.checked[S.shop][norm(name)]=false;await save();render()}
function renderUsuals(){let manual=S.data.manual?.[S.shop]||[];return '<div class="panel"><div class="between"><h2 class="usuals-heading">Your usuals</h2><button class="ghost usuals-edit" data-action="manageUsuals">Edit usuals</button></div><small>Tap to add. Anything you type once is remembered here.</small><div class="usuals">'+usuals().map(x=>{let added=manual.some(m=>norm(m.name)===norm(x.name))&&!S.data.checked?.[S.shop]?.[norm(x.name)];return '<button class="'+(added?'added':'')+'" data-usual="'+esc(x.name)+'" '+(added?'disabled':'')+' aria-label="'+esc((added?'Already added ':'Add ')+x.name)+'">'+(added?'✓':'＋')+' '+esc(x.name)+'</button>'}).join('')+'</div><form class="manual-form" id="manualForm"><input id="quick" autocomplete="off" placeholder="Something else? Add it once…" aria-label="Add another grocery"><button type="submit" class="primary">Add</button></form></div>'}
function manageUsuals(){ $('#overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="between"><h2>Your usual groceries</h2><button data-action="close" aria-label="Close">✕</button></div><p class="muted tiny">Keep the things you buy often. Hiding a button does not remove anything from your shopping list.</p><div class="usuals-manager">'+usuals().map(x=>'<div class="between"><span>'+esc(x.name)+'</span><button data-hide-usual="'+esc(x.name)+'">Hide</button></div>').join('')+'</div><form class="manual-form" id="usualForm"><input id="usualName" placeholder="Add another usual…" aria-label="New usual grocery" required><button type="submit" class="primary">Save usual</button></form>'+((S.data.hiddenUsuals||[]).length?'<button class="ghost" data-action="restoreUsuals">Restore hidden buttons</button>':'')+'</div></div>'}
function categoryFor(name){return S.ingredients.find(i=>norm(i.name)===norm(name))?.grocery_category||DEFAULT_USUALS.find(i=>norm(i.name)===norm(name))?.category||'Other'}
function suggestions(){let used=new Set(Object.values(current()).map(x=>x?.meal).filter(Boolean)),missed=[];for(let w=1;w<=8;w++)for(let x of Object.values(S.data.plans?.[shift(S.week,-7*w)]||{}))if(x?.notMade&&x.meal&&!used.has(x.meal)&&!missed.includes(x.meal))missed.push(x.meal);return [...missed.map(id=>S.meals.find(m=>m.id===id)).filter(Boolean),...S.meals.filter(m=>!used.has(m.id)&&!missed.includes(m.id)).sort((a,b)=>Number(b.prior)-Number(a.prior)||(b.rating||0)-(a.rating||0))]}
function shopping(shoppingWeek=S.shop){let map=new Map(),plan=S.data.plans?.[shoppingWeek]||{};for(let n=0;n<7;n++){let p=plan[n],m=S.meals.find(x=>x.id===p?.meal&&!p.notMade);if(!m)continue;for(let item of purchases(m.id)){if(norm(item.grocery_category)==='skip'||STAPLES.has(norm(item.name)))continue;let k=norm(item.name);if(!map.has(k))map.set(k,{key:k,name:item.name,category:groceryCategory(item.grocery_category),sources:[],manual:false});let row=map.get(k);if(!row.sources.includes(m.name))row.sources.push(m.name)}}for(let x of S.data.manual?.[shoppingWeek]||[]){let k=norm(x.name);if(map.has(k))map.get(k).manual=true;else map.set(k,{key:k,name:x.name,category:groceryCategory(x.category),sources:[],manual:true})}return [...map.values()].map(x=>({...x,qty:S.data.quantities?.[shoppingWeek]?.[x.key]||1,checked:!!S.data.checked?.[shoppingWeek]?.[x.key]})).sort((a,b)=>a.name.localeCompare(b.name))}
async function load(){try{const r=await Promise.all([db.from('meal_app_households').select('data').eq('code',CODE).single(),db.from('meal_app_meals').select('*').eq('household_code',CODE).eq('is_active',true),db.from('meal_app_ingredients').select('*').eq('is_active',true),db.from('meal_app_meal_ingredients').select('*')]);for(let q of r)if(q.error)throw q.error;S.data=r[0].data.data||{};S.meals=r[1].data;S.ingredients=r[2].data;S.links=r[3].data;S.ready=true;$('#sync').textContent='● Synced';render()}catch(e){$('#sync').textContent='Offline';$('#app').innerHTML='<div class="panel error">'+esc(e.message)+'</div>';console.error(e)}}
async function save(){let q=await db.from('meal_app_households').update({data:S.data,updated:new Date().toISOString()}).eq('code',CODE);if(q.error){$('#sync').textContent='Save failed';alert(q.error.message);throw q.error}$('#sync').textContent='● Synced'}
function isGroupMeal(m){return norm(m?.group_size)==='large group'}
function eligibleMeals(n,list=S.meals){return current()[n]?.hosting?list.filter(isGroupMeal):list}
async function toggleHosting(n){S.data.plans ||= {};S.data.plans[S.week] ||= {};let day=current()[n]||{meal:null,notMade:false};day.hosting=!day.hosting;if(day.hosting&&day.meal&&!isGroupMeal(S.meals.find(m=>m.id===day.meal))){day.meal=null;day.notMade=false}current()[n]=day;await save();render()}
async function setMeal(n,id){if(id&&!eligibleMeals(n).some(m=>m.id===id))return;S.data.plans ||= {};S.data.plans[S.week] ||= {};S.data.plans[S.week][n]={...current()[n],meal:id||null,notMade:false};await save();render()}
function render(){if(!S.ready)return;$('#tabs').innerHTML=[['plan','⌂ Plan'],['shop','▤ Shop'],['meals','♡ Meals']].map(([k,v])=>'<button class="'+(S.tab===k?'active':'')+'" data-tab="'+k+'">'+v+'</button>').join('');document.body.classList.toggle('shopping-mode',S.store);$('#app').className=S.store?'store':'';$('#app').innerHTML=S.tab==='plan'?renderPlan():S.tab==='shop'?renderShop():renderMeals()}
function renderPlan(){let p=current(),count=Object.values(p).filter(x=>x?.meal).length,groceryCount=shopping(S.week).length;return '<div class="between"><div><h2>This week</h2><small>'+count+' of 7 meals planned</small></div><div class="weeknav"><button data-action="prev">‹</button><strong>'+date(S.week)+'</strong><button data-action="next">›</button></div></div><div class="toolbar"><button class="primary" data-action="fill">✦ Fill week</button><button data-action="today">Today</button><button data-action="shuffle">Shuffle all</button><button data-action="clear">Clear week</button><button class="primary" data-action="groceries">Groceries for this week · '+groceryCount+'</button></div><p class="muted tiny">Your meal purchase needs are added automatically. Pantry staples stay off the list.</p><div class="stack">'+D.map((d,n)=>{let day=p[n],m=S.meals.find(x=>x.id===day?.meal);return '<div class="meal-row '+(day?.hosting?'hosting':'')+'"><div class="date"><strong>'+d+'</strong><small>'+date(shift(S.week,n))+'</small></div><div class="meal-name"><strong>'+esc(m?.name||'Open for ideas')+'</strong><small>'+esc(day?.notMade?'Not made · suggest again':m?.group_size||'Tap to choose a meal')+'</small><button class="hosting-toggle" data-hosting="'+n+'" aria-pressed="'+!!day?.hosting+'" aria-label="'+(day?.hosting?'Stop hosting':'Host a group')+' on '+d+'">'+(day?.hosting?'Hosting · Group meals':'Host a group')+'</button></div><button class="round" data-pick="'+n+'">✎</button><button class="round" data-roll="'+n+'">↻</button>'+(m?'<button class="round" data-missed="'+n+'" title="Not made">'+(day.notMade?'↩':'✓')+'</button>':'')+'</div>'}).join('')+'</div><div class="panel"><div class="between"><strong>On deck</strong><span class="tag">Your favorites + missed meals</span></div><div class="toolbar">'+suggestions().slice(0,4).map(m=>'<button data-add="'+m.id+'">'+esc(m.name)+'</button>').join('')+'</div></div><small>Version '+BUILD+'</small>'}
function renderStore(){let rows=shopping(),left=rows.filter(x=>!x.checked).length;return '<div class="store-header"><div><strong>Shopping</strong><small>'+left+' left · '+date(S.shop)+' – '+date(shift(S.shop,6))+'</small></div><button class="primary" data-action="store" aria-label="Exit store mode">Done ✕</button></div><div class="store-list">'+(!rows.length?'<p class="muted">Your shopping list is empty.</p>':!left?'<p class="store-complete">✓ Everything is in your cart!</p>':'')+C.map(cat=>{let items=rows.filter(x=>x.category===cat);return items.length?'<h3>'+cat+'</h3>'+items.map(x=>'<button class="store-item '+(x.checked?'collected':'')+'" data-check="'+esc(x.key)+'" aria-pressed="'+x.checked+'" aria-label="'+esc((x.checked?'Uncheck ':'Check off ')+x.name)+'"><span class="store-check" aria-hidden="true">'+(x.checked?'✓':'')+'</span><span class="store-name"><strong>'+esc(x.name)+'</strong><small>'+esc(x.sources.join(' · ')||'Added by you')+'</small></span><span class="store-qty">×'+x.qty+'</span></button>').join(''):''}).join('')+'</div>'}
function renderShop(){if(S.store)return renderStore();let rows=shopping(),section=(arr)=>C.map(cat=>{let items=arr.filter(x=>x.category===cat);return items.length?'<h3>'+cat+'</h3><div class="panel">'+items.map(x=>'<div class="shop-row '+(x.checked?'done':'')+'" data-check="'+esc(x.key)+'"><button class="check ghost" data-check="'+esc(x.key)+'">'+(x.checked?'☑':'□')+'</button><div class="grow"><strong>'+esc(x.name)+'</strong><small>'+esc(x.sources.join(' · ')||'Added by you')+'</small></div><div class="adjust flex"><button data-qty="-1" data-name="'+esc(x.key)+'">−</button></div><span class="qty">'+x.qty+'</span><div class="adjust"><button data-qty="1" data-name="'+esc(x.key)+'">+</button>'+(x.manual?'<button data-remove="'+esc(x.key)+'">×</button>':'')+'</div></div>').join('')+'</div>':''}).join('');return '<div class="between"><div><div class="eyebrow">Everything in one place</div><h1>Shopping list</h1></div><button data-action="store" class="'+(S.store?'primary':'')+'">'+(S.store?'Done shopping':'Store mode')+'</button></div><div class="weeknav"><button data-action="shopPrev">‹</button><strong>'+date(S.shop)+' – '+date(shift(S.shop,6))+'</strong><button data-action="shopNext">›</button></div>'+(!S.store?renderUsuals():'')+'<div class="between"><h2>To pick up</h2><span class="tag">'+rows.filter(x=>!x.checked).length+' items</span></div>'+section(rows.filter(x=>!x.checked))+(rows.some(x=>x.checked)?'<h2>In your cart</h2>'+section(rows.filter(x=>x.checked)):'')+(!rows.length?'<div class="panel muted">Your list fills itself as you plan meals. You can also add anything manually.</div>':'')}
function renderMeals(){let list=S.meals.filter(m=>norm(m.name).includes(norm(S.search))).sort((a,b)=>a.name.localeCompare(b.name));return '<div class="between"><div><div class="eyebrow">Your family’s collection</div><h1>Meal book</h1><small>'+S.meals.length+' saved meals</small></div><button class="primary" data-action="new">+ Add meal</button></div><div class="toolbar"><input id="search" placeholder="Find a family favorite…" value="'+esc(S.search)+'"></div><div class="grid">'+list.map(m=>'<div class="meal-card"><div class="between"><strong>'+esc(m.name)+'</strong><button data-edit="'+m.id+'">Edit</button></div><p>'+esc(m.group_size||'Family')+' · '+(m.rating||'–')+' ★ '+(m.prior?' · ♥ Favorite':'')+'</p><small>Buy: '+esc(purchases(m.id).map(x=>x.name).join(', ')||'Nothing needed')+'</small></div>').join('')+'</div>'}
function pick(n){let p=current()[n],options=eligibleMeals(n).slice().sort((a,b)=>a.name.localeCompare(b.name));$('#overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="between"><h2>Choose '+D[n]+(p?.hosting?' group dinner':' dinner')+'</h2><button data-action="close">✕</button></div><input id="pickSearch" placeholder="Search your meals…"><div id="pickList" style="margin-top:12px">'+options.map(m=>'<button style="width:100%;text-align:left;margin:3px 0" data-select="'+m.id+'" data-day="'+n+'">'+esc(m.name)+'</button>').join('')+'</div><button data-select="" data-day="'+n+'">Clear this day</button></div></div>'}
function edit(id){S.edit=id;let m=S.meals.find(x=>x.id===id)||{};$('#overlay').innerHTML='<div class="overlay"><div class="sheet"><div class="between"><h2>'+ (id?'Edit meal':'Add a meal')+'</h2><button data-action="close">✕</button></div><div class="field"><label>Meal name</label><input id="mealName" value="'+esc(m.name||'')+'"></div><div class="field"><label>Rating</label><select id="rating">'+[1,2,3,4,5].map(x=>'<option '+(x===(m.rating||3)?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Category</label><input id="category" value="'+esc(m.category||'Dinner')+'"></div><div class="field"><label>Serves</label><select id="group">'+['Family','Company','Large Group'].map(x=>'<option '+(x===m.group_size?'selected':'')+'>'+x+'</option>').join('')+'</select></div><label><input id="favorite" type="checkbox" style="width:auto;min-height:auto" '+(m.prior?'checked':'')+'> Family favorite</label><div class="field"><label>What to buy (one item per line)</label><textarea id="buy" rows="7">'+esc(id?purchases(id).map(x=>x.name).join('\n'):'')+'</textarea><small>Leave pantry staples out unless you need to buy them.</small></div><div class="toolbar"><button class="primary" data-action="saveMeal">Save meal</button>'+(id?'<button data-action="deleteMeal">Remove</button>':'')+'</div></div></div>'}
async function saveMeal(){let name=$('#mealName').value.trim();if(!name)return alert('Add a meal name');let payload={household_code:CODE,name,normalized_name:norm(name),rating:+$('#rating').value,category:$('#category').value,group_size:$('#group').value,prior:$('#favorite').checked};let r=S.edit?await db.from('meal_app_meals').update(payload).eq('id',S.edit).select().single():await db.from('meal_app_meals').insert(payload).select().single();if(r.error)return alert(r.error.message);let id=r.data.id,names=[...new Set($('#buy').value.split('\n').map(norm).filter(Boolean))];for(let k of names){let item=S.ingredients.find(x=>norm(x.name)===k);if(!item){let q=await db.from('meal_app_ingredients').upsert({name:k,normalized_name:k,grocery_category:'Pantry'},{onConflict:'normalized_name'}).select().single();if(q.error)return alert(q.error.message);item=q.data;S.ingredients.push(item)}if(!S.links.some(l=>l.meal_id===id&&l.ingredient_id===item.id)){let q=await db.from('meal_app_meal_ingredients').insert({meal_id:id,ingredient_id:item.id,source:'manual',needs_review:false});if(q.error)return alert(q.error.message)}}for(let l of S.links.filter(x=>x.meal_id===id&&!names.includes(norm(S.ingredients.find(i=>i.id===x.ingredient_id)?.name)))){let q=await db.from('meal_app_meal_ingredients').delete().eq('id',l.id);if(q.error)return alert(q.error.message)}$('#overlay').innerHTML='';await load()}
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}if(e.target.id==='pickSearch'){let q=norm(e.target.value);for(let b of document.querySelectorAll('[data-select]'))b.hidden=!norm(b.textContent).includes(q)}});
document.addEventListener('click',async e=>{let b=e.target.closest('button,[data-check]');if(!b)return;if(b.type==='submit'&&b.form)return;let d=b.dataset;if(d.usual){let x=usuals().find(x=>norm(x.name)===norm(d.usual));await addManual(d.usual,x?.category||categoryFor(d.usual));return}if(d.hideUsual){S.data.hiddenUsuals ||= [];if(!S.data.hiddenUsuals.includes(norm(d.hideUsual)))S.data.hiddenUsuals.push(norm(d.hideUsual));await save();render();manageUsuals();return}if(d.tab){openTab(d.tab);return}if(d.hosting!==undefined){await toggleHosting(+d.hosting);return}if(d.pick!==undefined){pick(+d.pick);return}if(d.edit){edit(d.edit);return}if(d.select!==undefined){$('#overlay').innerHTML='';await setMeal(+d.day,d.select);return}if(d.roll!==undefined){let n=+d.roll,options=eligibleMeals(n,suggestions()).filter(m=>m.id!==current()[n]?.meal);if(options.length)await setMeal(n,options[Math.floor(Math.random()*Math.min(options.length,8))].id);return}if(d.missed!==undefined){let p=current()[+d.missed];p.notMade=!p.notMade;await save();render();return}if(d.add){let n=D.findIndex((_,i)=>!current()[i]?.meal&&eligibleMeals(i).some(m=>m.id===d.add));if(n===-1)return alert('Choose a day to replace first');await setMeal(n,d.add);return}if(d.check!==undefined){if(e.target.closest('[data-qty],[data-remove]'))return;S.data.checked ||= {};S.data.checked[S.shop] ||= {};S.data.checked[S.shop][d.check]=!S.data.checked[S.shop][d.check];await save();render();return}if(d.qty){S.data.quantities ||= {};S.data.quantities[S.shop] ||= {};let x=shopping().find(x=>x.key===d.name);S.data.quantities[S.shop][d.name]=Math.max(1,(x?.qty||1)+Number(d.qty));await save();render();return}if(d.remove){S.data.manual[S.shop]=(S.data.manual?.[S.shop]||[]).filter(x=>norm(x.name)!==d.remove);await save();render();return}switch(d.action){case'manageUsuals':manageUsuals();return;case'restoreUsuals':S.data.hiddenUsuals=[];await save();render();manageUsuals();return;case'groceries':openTab('shop');return;case'prev':S.week=shift(S.week,-7);break;case'next':S.week=shift(S.week,7);break;case'today':S.week=week();break;case'shopPrev':S.shop=shift(S.shop,-7);break;case'shopNext':S.shop=shift(S.shop,7);break;case'store':S.store=!S.store;break;case'fill':{S.data.plans ||= {};S.data.plans[S.week] ||= {};let used=new Set(Object.values(current()).map(x=>x?.meal)),pool=suggestions();for(let n=0;n<7;n++){if(current()[n]?.meal)continue;let m=eligibleMeals(n,pool).find(x=>!used.has(x.id));if(m){current()[n]={...current()[n],meal:m.id,notMade:false};used.add(m.id)}}await save();break}case'shuffle':{S.data.plans ||= {};S.data.plans[S.week] ||= {};let pool=S.meals.slice().sort(()=>Math.random()-.5);let used=new Set();for(let n=0;n<7;n++){let options=eligibleMeals(n,pool),m=options.find(x=>!used.has(x.id))||options[0];current()[n]={...current()[n],meal:m?.id||null,notMade:false};if(m)used.add(m.id)};await save();break}case'clear':if(confirm('Clear all seven days?')){S.data.plans ||= {};S.data.plans[S.week]=Object.fromEntries(D.map((_,n)=>[n,{hosting:!!current()[n]?.hosting,meal:null,notMade:false}]));await save()}break;case'quick':{let name=$('#quick').value.trim();await addManual(name,categoryFor(name));return}case'new':edit(null);return;case'close':$('#overlay').innerHTML='';return;case'saveMeal':await saveMeal();return;case'deleteMeal':if(confirm('Remove this meal?')){let q=await db.from('meal_app_meals').update({is_active:false}).eq('id',S.edit);if(q.error)alert(q.error.message);else{$('#overlay').innerHTML='';await load()}}return}render()});
document.addEventListener('submit',async e=>{if(e.target.id==='manualForm'){e.preventDefault();let name=$('#quick').value.trim();await addManual(name,categoryFor(name))}else if(e.target.id==='usualForm'){e.preventDefault();let name=$('#usualName').value.trim();if(!name)return;rememberUsual(name,groceryCategory(categoryFor(name)));await save();render();manageUsuals()}});
load();
</script></body></html>
